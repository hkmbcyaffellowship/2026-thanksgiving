<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&family=Long+Cang&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body{
    min-height:100vh;
    font-family:"Kalam","Ma Shan Zheng",cursive;
    background:
      radial-gradient(circle at 15% 25%, rgba(255,183,77,.28) 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(255,138,101,.22) 0%, transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(255,213,79,.18) 0%, transparent 50%),
      linear-gradient(160deg,#fff3e0 0%,#ffe0b2 40%,#ffcc80 100%);
    background-attachment:fixed;
    padding:0 0 60px;
    overflow-x:hidden;
  }

  .falling-leaves{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .leaf{position:absolute;top:-60px;font-size:26px;opacity:.75;animation:fall linear infinite;}
  @keyframes fall{
    0%  {transform:translateY(0) rotate(0deg) translateX(0);opacity:.8;}
    100%{transform:translateY(110vh) rotate(360deg) translateX(40px);opacity:0;}
  }

  header{
    text-align:center;
    padding:52px 20px 28px;
    position:relative;
    z-index:2;
  }
  .header-deco{font-size:44px;animation:wiggle 3s ease-in-out infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  header h1{
    font-family:"Ma Shan Zheng",cursive;
    font-size:clamp(34px,6vw,60px);
    color:#bf360c;
    text-shadow:2px 2px 0 #ffe0b2, 4px 4px 0 rgba(191,54,12,.12);
    margin:10px 0 6px;
    letter-spacing:3px;
  }
  header .subtitle{
    font-family:"Kalam",cursive;
    font-size:clamp(15px,2.5vw,20px);
    color:#e65100;
    opacity:.9;
  }
  .count-badge{
    display:inline-block;
    margin-top:16px;
    background:#ff8a65;
    color:#fff;
    padding:6px 22px;
    border-radius:30px;
    font-size:16px;
    box-shadow:0 4px 12px rgba(255,112,67,.4);
  }

  /* ============ 瀑布流：改用 Grid ============ */
  .wall{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-auto-rows:10px;  /* 基礎行高 10px，JS 動態設 span */
    grid-gap:0 22px;
    padding:20px 32px;
    max-width:1400px;
    margin:0 auto;
    position:relative;
    z-index:2;
  }
  @media(max-width:1100px){ .wall{grid-template-columns:repeat(3, 1fr);} }
  @media(max-width:820px) { .wall{grid-template-columns:repeat(2, 1fr);} }
  @media(max-width:520px) { .wall{grid-template-columns:1fr;padding:16px;} }

  .card-wrapper{
    position:relative;
    margin-bottom:22px;
    grid-row-end:span 40; /* 默認值，JS 會覆蓋 */
  }

  .card{
    border-radius:18px;
    padding:20px 18px 16px;
    position:relative;
    box-shadow:0 6px 18px rgba(120,60,20,.18), 0 2px 4px rgba(120,60,20,.1);
    transform:rotate(var(--rot));
    transition:transform .25s ease, box-shadow .25s ease;
    animation:popIn .6s ease backwards;
  }
  .card:hover{ transform:rotate(0deg) scale(1.03); box-shadow:0 12px 30px rgba(120,60,20,.28); z-index:5; }
  @keyframes popIn{ from{opacity:0;transform:scale(.6) rotate(var(--rot));} to{opacity:1;transform:scale(1) rotate(var(--rot));} }

  .tape{
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:70px;
    height:24px;
    background:rgba(255,255,255,.55);
    box-shadow:0 1px 3px rgba(0,0,0,.1);
    z-index:3;
  }

  .card-top{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .avatar{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Kalam",cursive;font-weight:700;font-size:20px;
    color:#fff;flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,.18);
    text-shadow:1px 1px 0 rgba(0,0,0,.15);
  }
  .name{ font-family:"Kalam",cursive; font-size:17px; font-weight:700; }

  .thanks-list{ list-style:none; }
  .thanks-list li{
    position:relative;
    padding:5px 0 5px 26px;
    line-height:1.55;
    font-size:16px;
  }
  .thanks-list li::before{
    content:var(--bullet);
    position:absolute;
    left:0; top:4px;
    font-size:16px;
  }

  .card-mascot{
    text-align:right;
    font-size:30px;
    margin-top:8px;
    line-height:1;
    opacity:.9;
  }

  footer{
    text-align:center;
    padding:30px 20px 0;
    position:relative;z-index:2;
  }
  footer p{ font-family:"Kalam",cursive; color:#bf360c; font-size:16px; opacity:.85; }
  .footer-mascots{ font-size:34px; letter-spacing:12px; margin-top:8px; }
</style>
</head>
<body>

<div class="falling-leaves" id="leaves"></div>

<header>
  <div class="header-deco">🦃</div>
  <h1>2026 感恩牆</h1>
  <div class="subtitle">YAF 團契 · 這個季節，我們一起數算恩典</div>
  <div class="count-badge" id="countBadge">已收集 0 位弟兄姊妹的感恩</div>
</header>

<div class="wall" id="wall"></div>

<footer>
  <div class="footer-mascots">🍁 🎃 🌻 🦃 🕯️</div>
  <p>「凡事謝恩，因為這是神在基督耶穌裡向你們所定的旨意。」— 帖撒羅尼迦前書 5:18</p>
</footer>

<script>
const thanksData = [
  {

  },
  {
    name:"Timothy Yau",
    color:"#fff9c4", text:"#5d4037",
    mascot:"🐣",
    items:["感恩可以來到西環堂事奉和大家一起同行","大學到現在的好友今日結婚了","今年各樣事奉都做得比較有效率，也已預備好之後的講章"]
  },
  {
    name:"William",
    items:["感恩神帶領我今年來到西環堂，經歷神，認識大家，融入YAF這個大家庭，很開心。下週還有洗禮","感恩神保佑今年一路過來無病無災，家人平安健康","感恩神讓我昨天發現家附近一家很好吃的糖水舖"]
  },
  {
    name:"Ada Lau",
    color:"#c8e6c9", font:"'Zhi Mang Xing',cursive", text:"#1b5e20",
    mascot:"🦋",
    items:["感恩我爸爸媽媽今年能夠決志信主","感恩我爸爸媽媽今年由年初身體病患甚至絕望，對現在能夠邁向健康正常","感恩我們這一家人團結，互相支援，感到十分幸福❤️"]
  },
  {
    name:"Teresa Zheng",
    items:["参加了两个课程培训：一个是如何带领查经，一个是navigating finance in God's will。感谢神让我有一颗好学上进的心","感谢神赐新的居所，很好很舒适，让家人和自己可以安然居住。感谢主在慢慢改变家人的心，让他们慢慢靠近神，希望神可以改变他们的心，最终信靠主耶稣","工作上面也慢慢有长进，越来越得到领导的认可。愿所有荣誉归给神","身体越来越健康，今年比较少病痛。感谢赞美主"]
  },
  {
    name:"Samuel",
    color:"#bbdefb", font:"'Long Cang',cursive", text:"#0d47a1",
    mascot:"🐢",
    items:["感恩今年5月中沒有了工作，一路開始尋求神的帶領，由模糊漸漸清晰，「宣教」這個詞不斷出現，下月開始在教會全職做傳道助理，計劃下年讀神學","感恩岳父岳母今年願意信耶穌，是一個非常大的神跡，竟然支持我全職服侍","感恩YAF團契的弟兄姊妹給了我很多服侍和學習的機會，是你們讓我的生命有了很多的長進"]
  },
  {
    name:"Anna Liu",
    items:["感恩今年能顺利毕业并找到心仪的工作","感恩自己今年能来到西环堂认识大家并融入YAF","感恩神一直赐予自己智慧，面对重要选择时都能做出正确决定","感恩神赐予一年一切都很平安"]
  },
  {
    name:"SophiaDYan竇🔆",
    items:["经历了工作、健康、关系的更新，体验到顺服和交托的平安喜乐，并且觉察到有待做到全然🙇🏻‍♀️感谢管教","感谢光照，经历了属灵的连接和同行，体验到有问必答的看顾和同在👼🏻","恩典先临，爸爸十年前就出于好奇/爱读完了圣经，求神继续带领我们成为福音在这个家庭生根的器皿🙌🏻"]
  },
  {
    name:"小多",
    items:["感恩参加了10月底的使命营，让自己更清楚自己的使命，还意外得到一个多方印证的名字（珍珠/Pearl）。每当叫这个名字，我就会想起这个使命营，也会带着新的名字，进入将来的每一天","感恩闺蜜家的两个小朋友，去年和他们的交往中，我感受到他们纯粹、直接而热烈的接纳和爱意","感恩众多的智者先贤，写下他们对不同话题的智慧并成书，我能通过阅读思考和成长","近几年身体有软弱，精力不如从前，但感恩慢慢恢复中，也在有限的精力中学习取舍"]
  },
  {
    name:"Manyi Yau",
    items:["感恩先生健康基本穩定，可以彼此扶持，享受一同服侍，一同出遊！","在服侍中經歷神數不盡的恩典，看見神多麼聽禱告：無論是門徒訓練，講台服侍，YAF團契，幫外部機構教課，還是新堂的建設","感恩主憐憫看顧父母，保守他們的信仰、健康與和睦，使我無後顧之憂"]
  },
  {
    name:"Miss Tse",
    items:["自己的健康情況基本穩定。癌症康復跨過五年大關","家人健康蒙受神的恩典也基本穩定","神在身上彰顯他的大能，成就一些我沒想過可能成功的事情。給予甚至超出我所求","保守我有時想做一些不合神心儀的事情，會有信仰令我懸崖勒馬"]
  }
];

const palette = [
  {bg:"#ffe0b2", txt:"#bf360c"},
  {bg:"#fff9c4", txt:"#5d4037"},
  {bg:"#c8e6c9", txt:"#1b5e20"},
  {bg:"#bbdefb", txt:"#0d47a1"},
  {bg:"#f8bbd0", txt:"#880e4f"},
  {bg:"#d7ccc8", txt:"#3e2723"},
  {bg:"#e1bee7", txt:"#4a148c"},
  {bg:"#b2ebf2", txt:"#004d40"},
  {bg:"#ffcdd2", txt:"#b71c1c"},
  {bg:"#dcedc8", txt:"#33691e"}
];
const fonts = [
  "'Ma Shan Zheng',cursive",
  "'Zhi Mang Xing',cursive",
  "'Long Cang',cursive",
  "'Kalam',cursive"
];
const bullets = ["'🍁'","'🎃'","'🌻'","'🍂'","'🕯️'","'🦃'","'🌾'","'💛'"];
const mascots = ["🐣","🦋","🐢","🦒","🦉","🐝","🐧","🦊","🐰","🐼","🦉","🐥"];
const rots = ["-2deg","1.5deg","-1deg","2deg","-2.5deg","1deg"];
const tapeColors = [
  "rgba(255,255,255,.55)",
  "rgba(255,240,200,.6)",
  "rgba(200,230,255,.55)",
  "rgba(220,255,220,.55)",
  "rgba(255,220,240,.55)"
];

const wall = document.getElementById("wall");
const badge = document.getElementById("countBadge");
let totalThanks = 0;

// 用於 Grid 瀑布流的列高追蹤
const getColumnCount = () => {
  const w = window.innerWidth;
  if(w <= 520) return 1;
  if(w <= 820) return 2;
  if(w <= 1100) return 3;
  return 4;
};

thanksData.forEach((p, i) => {
  const c = palette[i % palette.length];
  const bg   = p.color || c.bg;
  const txt  = p.text  || c.txt;
  const font = p.font  || fonts[i % fonts.length];
  const bullet = bullets[i % bullets.length];
  const mascot = p.mascot || mascots[i % mascots.length];
  const rot  = rots[i % rots.length];
  const tapeColor = tapeColors[i % tapeColors.length];
  const tapeRot = (Math.random()-0.5)*6;
  const initial = p.name.trim().charAt(0).toUpperCase();
  const avaBg = c.txt;

  const liHTML = p.items.map(it => `<li>${it}</li>`).join("");
  totalThanks += p.items.length;

  const wrapper = document.createElement("div");
  wrapper.className = "card-wrapper";
  wrapper.style.animationDelay = `${i*0.08}s`;
  wrapper.innerHTML = `
    <div class="tape" style="background:${tapeColor};transform:translateX(-50%) rotate(${tapeRot}deg);"></div>
    <div class="card" style="--rot:${rot};--bullet:${bullet};background:${bg};color:${txt};font-family:${font};animation-delay:${i*0.08}s;">
      <div class="card-top">
        <div class="avatar" style="background:${avaBg}">${initial}</div>
        <div class="name">${p.name}</div>
      </div>
      <ul class="thanks-list">${liHTML}</ul>
      <div class="card-mascot">${mascot}</div>
    </div>
  `;
  wall.appendChild(wrapper);
});

// Grid 瀑布流：計算每張卡片高度並設置 grid-row-end span
function layoutGrid(){
  const wrappers = wall.querySelectorAll('.card-wrapper');
  const colCount = getColumnCount();
  const colHeights = new Array(colCount).fill(0);
  const wallLeft = wall.getBoundingClientRect().left;
  const colWidth = wall.clientWidth / colCount;
  const gap = 22;

  wrappers.forEach(wrapper => {
    const rect = wrapper.getBoundingClientRect();
    // 找到最短的列
    const shortestCol = colHeights.indexOf(Math.min(...colHeights));
    // 設置位置
    const x = shortestCol * (colWidth + gap);
    wrapper.style.position = 'absolute';
    wrapper.style.left = x + 'px';
    wrapper.style.top = colHeights[shortestCol] + 'px';
    wrapper.style.width = colWidth + 'px';
    // 更新列高
    colHeights[shortestCol] += wrapper.offsetHeight + 22;
  });
  // 設置 wall 高度
  wall.style.height = Math.max(...colHeights) + 'px';
}

// 等待字體加載後佈局
document.fonts.ready.then(() => {
  layoutGrid();
});

// 窗口大小改變時重新佈局
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    // 重置位置
    const wrappers = wall.querySelectorAll('.card-wrapper');
    wrappers.forEach(w => {
      w.style.position = '';
      w.style.left = '';
      w.style.top = '';
      w.style.width = '';
    });
    wall.style.height = '';
    layoutGrid();
  }, 250);
});

badge.textContent = `已收集 ${thanksData.length} 位弟兄姊妹的感恩（共 ${totalThanks} 件）`;

const leavesBox = document.getElementById("leaves");
const leafEmoji = ["🍁","🍂","🍃"];
for(let i=0;i<22;i++){
  const l = document.createElement("div");
  l.className = "leaf";
  l.textContent = leafEmoji[Math.floor(Math.random()*leafEmoji.length)];
  l.style.left = Math.random()*100 + "%";
  l.style.animationDuration = (6+Math.random()*8) + "s";
  l.style.animationDelay = (Math.random()*10) + "s";
  l.style.fontSize = (20+Math.random()*18) + "px";
  leavesBox.appendChild(l);
}
</script>
</body>
</html>
